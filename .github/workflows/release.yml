name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to validate, for example v1.6.0
        required: true
        type: string
      publish:
        description: Publish the validated tag as a formal GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release

    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Read SDK version
        id: sdk
        shell: pwsh
        run: |
          $line = Select-String -Path .\gradle.properties -Pattern '^atsPluginSdkVersion=(.+)$'
          if ($null -eq $line) { throw 'atsPluginSdkVersion is missing' }
          "version=$($line.Matches[0].Groups[1].Value.Trim())" >> $env:GITHUB_OUTPUT

      - name: Checkout matching plugin SDK source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: android-tool-suite/app
          ref: plugin-sdk-v${{ steps.sdk.outputs.version }}
          path: _sdk-source

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          gradle-version: '8.9'

      - name: Prepare SDK
        shell: pwsh
        run: |
          $repository = Join-Path $env:RUNNER_TEMP 'ats-sdk-repository'
          gradle -p .\_sdk-source :plugin-sdk:publishReleasePublicationToPluginSdkRepository "-PpluginSdkRepository=$repository"
          if ($LASTEXITCODE -ne 0) { throw 'SDK publication failed' }
          "ATS_SDK_REPOSITORY=$repository" >> $env:GITHUB_ENV

      - name: Test and build release package
        shell: pwsh
        run: |
          gradle testDebugUnitTest
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          gradle clean packageReleasePlugin
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          .\.github\scripts\prepare-release.ps1 `
            -ArtifactPath .\build\outputs\atsplugin\release\gacha-analysis.atsplugin `
            -OutputDirectory .\release-dist `
            -ExpectedTag $tag

      - name: Upload dry-run assets
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gacha-release-dry-run-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          gh release create $tag `
            .\release-dist\gacha-analysis.atsplugin `
            .\release-dist\release-metadata.json `
            .\release-dist\SHA256SUMS.txt `
            --verify-tag --draft `
            --title "Gacha Analysis $tag" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Notify plugin registry
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Warning 'REGISTRY_DISPATCH_TOKEN is not configured; run the plugin-registry deployment workflow manually.'
            return
          }
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          $payload = [ordered]@{
            event_type = 'component_published'
            client_payload = [ordered]@{
              channel = 'release'
              repository = $env:GITHUB_REPOSITORY
              commitSha = (git rev-parse HEAD)
              reference = $tag
            }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api --method POST repos/android-tool-suite/plugin-registry/dispatches --input -
          if ($LASTEXITCODE -ne 0) { throw 'Could not notify plugin registry' }
