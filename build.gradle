plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def pluginVersionName = "1.6.0"
def pluginVersionCode = 10
def minHostVersionCode = 11
def pluginSdkVersion = providers.gradleProperty("atsPluginSdkVersion").get()

android {
    namespace "com.androidtoolsuite.app.plugin.gacha"
    compileSdk 35

    defaultConfig {
        applicationId "com.androidtoolsuite.app.plugin.gacha"
        minSdk 24
        targetSdk 35
        versionCode pluginVersionCode
        versionName pluginVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    compileOnly "com.androidtoolsuite:plugin-sdk:$pluginSdkVersion"
    implementation "com.google.zxing:core:3.5.3"
    testImplementation "com.androidtoolsuite:plugin-sdk:$pluginSdkVersion"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

def generatePluginManifest = tasks.register("generatePluginManifest", Copy) {
    inputs.property("pluginVersionName", pluginVersionName)
    inputs.property("pluginVersionCode", pluginVersionCode)
    inputs.property("minHostVersionCode", minHostVersionCode)
    inputs.property("pluginSdkVersion", pluginSdkVersion)
    from("manifest.template.json") {
        filter { line ->
            line.replace("@VERSION_NAME@", pluginVersionName)
                    .replace("@VERSION_CODE@", pluginVersionCode.toString())
                    .replace("@MIN_HOST_VERSION_CODE@", minHostVersionCode.toString())
                    .replace("@SDK_VERSION@", pluginSdkVersion)
        }
        rename { "manifest.json" }
    }
    into layout.buildDirectory.dir("generated/pluginManifest")
}

tasks.register("packageReleasePlugin", Zip) {
    dependsOn "assembleRelease", generatePluginManifest
    archiveFileName = "gacha-analysis.atsplugin"
    destinationDirectory = layout.buildDirectory.dir("outputs/atsplugin/release")
    from(generatePluginManifest)
    from(layout.buildDirectory.dir("outputs/apk/release")) {
        include "*.apk"
        rename { "plugin.apk" }
    }
}

tasks.register("packagePlugin", Zip) {
    dependsOn "assembleDebug", generatePluginManifest
    archiveFileName = "gacha-analysis.atsplugin"
    destinationDirectory = layout.buildDirectory.dir("outputs/atsplugin")
    from(generatePluginManifest)
    from(layout.buildDirectory.file("outputs/apk/debug/android-tool-suite-gacha-analysis-debug.apk")) {
        rename { "plugin.apk" }
    }
}

tasks.register("collectArtifacts", Copy) {
    dependsOn "packagePlugin"
    group = "distribution"
    description = "Collects the gacha analysis plugin package in the root artifacts directory."
    into layout.projectDirectory.dir("artifacts")
    from(layout.buildDirectory.dir("outputs/atsplugin")) {
        include "gacha-analysis.atsplugin"
    }
}
